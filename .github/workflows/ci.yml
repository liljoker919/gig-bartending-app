name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore gig-bartending-app.sln

      - name: Build
        run: dotnet build gig-bartending-app.sln --no-restore --configuration Release

      # No test project exists yet (see issue #51). Once one is added,
      # replace this with: dotnet test gig-bartending-app.sln --no-build --configuration Release
      - name: Test (placeholder)
        run: echo "No automated tests yet - see issue #51"
